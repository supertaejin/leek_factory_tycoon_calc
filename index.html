<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리크 팩토리 타이쿤 계산기</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 5px solid #3498db; }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; color: #2c3e50; }
        .card input { width: 90%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { display: block; width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #27ae60; }
        .results { margin-top: 30px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #ecf0f1; color: #2c3e50; }
        .deficit { color: #e74c3c; font-weight: bold; }
        .surplus { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏭 리크 팩토리 자원 흐름 계산기</h1>
    <p class="subtitle">각 시설의 초당 생산 가동률(/s)을 입력하세요.</p>
    
    <div class="grid">
        <!-- 사용자가 현재 세팅값을 언제든 바꿀 수 있게 입력창으로 구성 -->
        <div class="card"><h3>Monster Leek (/s)</h3><input type="number" id="rate_monster" value="0.0046" step="0.0001"></div>
        <div class="card"><h3>Refined Ultra (/s)</h3><input type="number" id="rate_refined" value="0.045" step="0.001"></div>
        <div class="card"><h3>Ultra Leek (/s)</h3><input type="number" id="rate_ultra" value="0.23" step="0.01"></div>
        <div class="card"><h3>Atomic Chive (/s)</h3><input type="number" id="rate_chive" value="0.97" step="0.01"></div>
        <div class="card"><h3>Golden Leek (/s)</h3><input type="number" id="rate_golden" value="4.98" step="0.01"></div>
        <div class="card"><h3>Leek Barrel (/s)</h3><input type="number" id="rate_barrel" value="0.73" step="0.01"></div>
        <div class="card"><h3>Atomic Leek (/s)</h3><input type="number" id="rate_atomic_leek" value="67.63" step="0.01"></div>
        <div class="card"><h3>Atomic Cake (/s)</h3><input type="number" id="rate_cake" value="1310" step="10"></div>
        <div class="card"><h3>Atomic Soup (/s)</h3><input type="number" id="rate_soup" value="19660" step="10"></div>
    </div>

    <button onclick="calculateFlow()">실시간 흐름 분석하기</button>

    <div class="results" id="resultsSection">
        <h2>📊 분석 결과</h2>
        <table>
            <thead>
                <tr>
                    <th>자원 이름</th>
                    <th>초당 순 변화량 (Net/s)</th>
                    <th>상태 평가</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
function formatNumber(num) {
    if (Math.abs(num) >= 1000000) return (num / 1000000).toFixed(2) + 'M';
    if (Math.abs(num) >= 1000) return (num / 1000).toFixed(2) + 'K';
    return num.toFixed(2);
}

function calculateFlow() {
    // 입력값 가져오기
    const r_monster = parseFloat(document.getElementById('rate_monster').value) || 0;
    const r_refined = parseFloat(document.getElementById('rate_refined').value) || 0;
    const r_ultra = parseFloat(document.getElementById('rate_ultra').value) || 0;
    const r_chive = parseFloat(document.getElementById('rate_chive').value) || 0;
    const r_golden = parseFloat(document.getElementById('rate_golden').value) || 0;
    const r_barrel = parseFloat(document.getElementById('rate_barrel').value) || 0;
    const r_atomic_leek = parseFloat(document.getElementById('rate_atomic_leek').value) || 0;
    const r_cake = parseFloat(document.getElementById('rate_cake').value) || 0;
    const r_soup = parseFloat(document.getElementById('rate_soup').value) || 0;

    // 자원 맵 초기화
    let net = {
        "Monster Leek": r_monster,
        "Refined Ultra Leek": r_refined,
        "Ultra Leek": r_ultra,
        "Atomic Chive": r_chive,
        "Golden Leek": r_golden,
        "Leek Barrel": r_barrel,
        "Atomic Leek": r_atomic_leek,
        "Atomic Cake": r_cake,
        "Atomic Soup": r_soup,
        "Leek": 0,
        "Leek Soup": 0
    };

    // 공식 대입 (생산은 더하고 소모는 빼기)
    // Monster Leek
    net["Refined Ultra Leek"] -= r_monster * 10;
    net["Ultra Leek"] -= r_monster * 50;
    net["Golden Leek"] -= r_monster * 500;
    net["Leek"] -= r_monster * 10000000;

    // Refined Ultra Leek
    net["Ultra Leek"] -= r_refined * 5;
    net["Atomic Chive"] -= r_refined * 20;
    net["Leek"] -= r_refined * 1000000;
    net["Leek Barrel"] += r_refined * 100; // 수식 기반 자동 인지 생산(+100)

    // Ultra Leek
    net["Golden Leek"] -= r_ultra * 10;
    net["Atomic Leek"] -= r_ultra * 20;
    net["Leek Soup"] -= r_ultra * 1000;
    net["Leek Barrel"] -= r_ultra * 0.4;
    net["Leek"] += r_ultra * 100000;

    // Atomic Chive
    net["Leek Barrel"] -= r_chive * 2;
    net["Atomic Leek"] -= r_chive * 20;

    // Golden Leek
    net["Atomic Leek"] -= r_golden * 10;
    net["Atomic Cake"] -= r_golden * 50;
    net["Leek Barrel"] -= r_golden * 0.2;
    net["Atomic Soup"] += r_golden * 500;

    // Leek Barrel
    net["Leek"] -= r_barrel * 10000;

    // Atomic Leek
    net["Atomic Cake"] -= r_atomic_leek * 10;
    net["Atomic Soup"] -= r_atomic_leek * 25;

    // Atomic Cake
    net["Atomic Soup"] -= r_cake * 10;

    // Atomic Soup
    net["Leek"] += r_soup * 10;

    // 화면에 렌더링
    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';

    for (const [resource, flow] of Object.entries(net)) {
        let statusClass = flow < 0 ? 'deficit' : 'surplus';
        let statusText = flow < 0 ? '⚠️ 부족 (적자)' : (flow === 0 ? '⚖️ 균형' : '✅ 안정 (흑자)');
        
        tbody.innerHTML += `
            <tr>
                <td><strong>${resource}</strong></td>
                <td class="${statusClass}">${formatNumber(flow)}/s</td>
                <td>${statusText}</td>
            </tr>
        `;
    }

    document.getElementById('resultsSection').style.display = 'block';
}
</script>

</body>
</html>
